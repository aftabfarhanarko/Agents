<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stockroom</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="bg-slate-50 text-slate-800">
    <div class="flex min-h-screen flex-col md:flex-row">
        <aside class="bg-slate-900 p-4 text-slate-200 md:w-56 md:shrink-0">
            <div class="mb-4 text-xl font-bold text-white">Stockroom</div>
            <nav id="nav" class="flex gap-1 overflow-x-auto md:flex-col"></nav>
            <label class="mt-4 block text-xs text-slate-400">Signed in as
                <select id="role" class="mt-1 w-full rounded bg-slate-800 p-2 text-sm text-white">
                    <option value="admin">Admin</option>
                    <option value="manager">Manager</option>
                    <option value="clerk">Clerk</option>
                </select>
            </label>
        </aside>
        <main id="main" class="min-w-0 flex-1 p-4 md:p-8"></main>
    </div>
    <dialog id="dlg" class="w-[92vw] max-w-lg rounded-xl p-0 backdrop:bg-black/50">
        <form id="dform" class="p-5">
            <h2 id="dtitle" class="mb-3 text-lg font-bold"></h2>
            <div id="dbody" class="space-y-3"></div>
            <p id="derr" class="mt-3 text-sm text-red-600" role="alert"></p>
            <div class="mt-4 flex justify-end gap-2">
                <button type="button" onclick="dlg.close()"
                    class="rounded px-3 py-2 text-sm hover:bg-slate-100">Close</button>
                <button id="dok" class="rounded bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Save</button>
            </div>
        </form>
    </dialog>
    <div id="toasts" class="fixed bottom-4 right-4 space-y-2"></div>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
