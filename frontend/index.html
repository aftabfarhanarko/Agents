<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockroom API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; }
    h1 { margin-bottom: 8px; }
    p { color: #666; }
    section { margin-top: 28px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    code { background: #f2f2f2; padding: 3px 6px; border-radius: 4px; }
    button { padding: 9px 14px; border: 0; border-radius: 5px; background: #315b45; color: white; cursor: pointer; }
    #result { margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Stockroom</h1>
  <p>A simple page for checking the backend connection.</p>

  <section>
    <h2>Backend status</h2>
    <p>API endpoint: <code>GET http://localhost:3000/api/health</code></p>
    <button id="check-button" type="button">Check connection</button>
    <span id="result" aria-live="polite">Not checked yet</span>
  </section>

  <script>
    const button = document.getElementById('check-button');
    const result = document.getElementById('result');

    button.addEventListener('click', async () => {
      result.textContent = 'Checking...';

      try {
        const response = await fetch('http://localhost:3000/api/health');
        if (!response.ok) throw new Error('Backend returned an error');

        const data = await response.json();
        result.textContent = `Connected: ${data.status}`;
      } catch {
        result.textContent = 'Could not connect. Start the backend and try again.';
      }
    });
  </script>
</body>
</html>
